<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>AHProfit</title>
		<style>
			* { margin: 0; padding: 0; box-sizing: border-box; }
			html, body { height: 100%; overflow: hidden; }
			body {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 22px;
				font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
				color: #e7fbf5;
				background: radial-gradient(120% 120% at 30% 20%, #128a72 0%, #0c5f4d 45%, #083d31 100%);
				user-select: none;
				-webkit-user-select: none;
				border: 1px solid rgba(255, 255, 255, 0.08);
				border-radius: 14px;
			}
			.mark {
				width: 68px;
				height: 68px;
				border-radius: 18px;
				background: linear-gradient(150deg, #5ce1c3, #16b894);
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
				display: grid;
				place-items: center;
				font-weight: 700;
				font-size: 30px;
				color: #06342a;
			}
			h1 { font-size: 20px; letter-spacing: 0.5px; font-weight: 600; }
			.row { display: flex; align-items: center; gap: 10px; opacity: 0.8; font-size: 13px; }
			.spinner {
				width: 15px;
				height: 15px;
				border: 2px solid rgba(231, 251, 245, 0.25);
				border-top-color: #e7fbf5;
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
			}
			@keyframes spin { to { transform: rotate(360deg); } }
		</style>
	</head>
	<body>
		<div class="mark">A</div>
		<h1>AHProfit</h1>
		<div class="row"><span class="spinner"></span><span>iniciando o servidor…</span></div>
	</body>
</html>
